name: Suggest a third-party skill
description: Propose a community skill for the optional groups
labels: [skill]
body:
  - type: input
    id: repo
    attributes: { label: Repository and path, placeholder: owner/repo — skills/name }
    validations: { required: true }
  - type: input
    id: license
    attributes: { label: License (SPDX) }
    validations: { required: true }
  - type: textarea
    id: why
    attributes: { label: Why it fits the team, and what you checked in its scripts }
